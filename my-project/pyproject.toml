[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "my-project"
version = "1.0.0"
description = "Federated Learning with YOLOv5 using Flower"
license = "Apache-2.0"
dependencies = [
    # Flower upgraded 1.13.1 -> 1.31.0 (latest). The legacy ServerApp(server_fn=...)
    # + Strategy(configure_fit/aggregate_fit) API the project uses still imports and
    # constructs under 1.31 (verified). See docs/ENGINEERING_NOTES.md.
    # Floor raised 1.31.0 -> 1.33.0 (latest on PyPI, 2026-08-05). 1.33 is what the
    # GPU bring-up and the CI simulation-smoke job were verified against; it is also
    # the version whose runtime-env behaviour docs/GPU_TESTPLAN.md §6 documents.
    "flwr[simulation]>=1.33.0,<2.0.0",
    # flwr-datasets dropped: it was unused in source and pinned an old version that
    # blocked the flwr upgrade. The project partitions its own BDD100K batch shards.
    # Floor raised 8.0.0 -> 8.4.115 (latest on PyPI, 2026-08-05): 8.4 is where the
    # AMP check fetches yolo26n.pt and where the MLflow callback used by the
    # pipeline component lives.
    "ultralytics>=8.4.115",
    "numpy>=1.26.0",
    "scipy>=1.7.0",
    "pandas>=1.3.0",
    "pyyaml>=6.0",
    "tqdm>=4.60.0"
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "flower"

[tool.flwr.app.components]
serverapp = "my_project.server_app:app"
clientapp = "my_project.client_app:app"

[tool.flwr.app.config]
num_server_rounds = 2
fraction_fit = 1.0
local_epochs = 1
# Must be <= num-supernodes below, otherwise FL never starts (waits forever for clients).
min_clients = 2
strategy = "fedavg"   # "fedavg" or "fedprox"
proximal_mu = 0.0     # FedProx proximal strength; >0 enables FedProx (default 0.1 if strategy=fedprox)
checkpoint_dir = "checkpoints"  # where the aggregated global model is saved
save_every = 1                  # save a global checkpoint every N rounds (always on final round)
# Ultralytics' dataset cache: "" (decode every epoch), "ram", or "disk". Empty is the
# default because RAM is the constraint: a shard held in RAM is roughly
# images x imgsz^2 x 3 bytes per *concurrent* client. The pipeline sets it per run.
cache = ""



# NOTE: `flwr run` rewrites this section in place on first use — it migrates the
# federations to ~/.flwr/config.toml and comments out everything below, leaving a
# "CONFIGURATION MIGRATION NOTICE" banner. That is a local artifact: do NOT commit
# the commented-out version, or a fresh clone has no federation to run at all.
# `git checkout -- pyproject.toml` after a run, and change live settings with
# `flwr run . --federation-config "..."` or in ~/.flwr/config.toml.

[tool.flwr.federations]
default = "local-simulation"

[tool.flwr.federations.local-simulation]
options.num-supernodes = 2
options.backend.client-resources.num-cpus = 4
# num-gpus = 1.0 on a single-card host makes Ray schedule clients ONE AT A TIME on
# the GPU: slower, but no OOM. Drop to 0.5/0.33 only once you know one client's real
# footprint. Set to 0 to fall back to CPU-only hosts.
options.backend.client-resources.num-gpus = 1.0
# flwr >= 1.31 reads `init-args` with dashes; the old `init_args.num_cpus` spelling
# is parsed as an unknown key and silently ignored.
options.backend.init-args.num-cpus = 8
options.backend.init-args.num-gpus = 1

# Real distributed deployment (Flower Deployment Engine): one SuperLink + N
# SuperNodes over gRPC+TLS. Point `address` at the SuperLink Exec API (9093) and
# `root-certificates` at the CA cert. Run with: flwr run . remote-deployment
# Override the host with the FL_SUPERLINK_HOST env at launch time if templating.
[tool.flwr.federations.remote-deployment]
address = "127.0.0.1:9093"
root-certificates = "certs/ca.crt"
